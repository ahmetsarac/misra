name: Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MISRA_STORE_FILE: ${{ github.workspace }}/keystore/misra-release.jks
      MISRA_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      MISRA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      MISRA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MISRA_STORE_PASSWORD" ]; then
            echo "Add KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/misra-release.jks

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort | tail -n 1)"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Version from APK
        id: version
        run: |
          AAPT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/aapt | sort | tail -n 1)"
          BADGING="$("$AAPT" dump badging app/build/outputs/apk/release/app-release.apk)"
          NAME="$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          CODE="$(echo "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Using versionName=$NAME versionCode=$CODE"

      - name: Name APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/Misra-${{ steps.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Misra-${{ steps.version.outputs.name }}
          path: dist/Misra-${{ steps.version.outputs.name }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.name }}
          files: dist/Misra-${{ steps.version.outputs.name }}.apk
          generate_release_notes: true
